# One-time: replaces keystore/dash-release.p12 with a new APK signing key made inside CI,
# encrypted with the DASH_KS_PASS secret (whatever password the owner put there).
# Only for a key that was never used for a published APK: devices accept updates only with the same key.
name: android-key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type new-key to replace keystore/dash-release.p12'
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  keygen:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate key
        env:
          DASH_KS_PASS: ${{ secrets.DASH_KS_PASS }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "new-key" ] || { echo "::error::type new-key to confirm"; exit 1; }
          [ -n "$DASH_KS_PASS" ] || { echo "::error::secret DASH_KS_PASS is not set"; exit 1; }
          V=$(sed -n 's/.*--version-name \([^ ]*\).*/\1/p' build.sh)
          if gh release view "android-v$V" >/dev/null 2>&1; then
            echo "::error::android-v$V is already published with the current key; bump the version first if you really mean it"
            exit 1
          fi
          rm -f keystore/dash-release.p12
          keytool -genkeypair -keystore keystore/dash-release.p12 -storetype PKCS12 -alias dash \
            -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Dash, O=Dash VPN" \
            -storepass:env DASH_KS_PASS -keypass:env DASH_KS_PASS
          keytool -list -keystore keystore/dash-release.p12 -storepass:env DASH_KS_PASS | grep -i dash
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/dash-release.p12
          git commit -qm "New APK signing key (encrypted with DASH_KS_PASS)"
          git push origin HEAD:main

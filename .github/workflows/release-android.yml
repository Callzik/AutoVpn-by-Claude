# Builds the release-signed APK and publishes it, all in Actions (Actions -> release-android -> Run workflow).
# Needs the DASH_KS_PASS secret (password of keystore/dash-release.p12).
# Creates the release android-v<ver> from build.sh's --version-name and writes url + sha256 into version.json on main.
name: release-android

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - name: Version
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*--version-name \([^ ]*\).*/\1/p' build.sh)
          C=$(sed -n 's/.*--version-code \([0-9]*\).*/\1/p' build.sh)
          [ -n "$V" ] && [ -n "$C" ] || { echo "::error::no version in build.sh"; exit 1; }
          if gh release view "android-v$V" >/dev/null 2>&1; then
            echo "::error::release android-v$V already exists: bump the version in build.sh and AndroidManifest.xml"
            exit 1
          fi
          echo "VER=$V" >> "$GITHUB_ENV"
          echo "CODE=$C" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Parser tests
        run: scripts/test-android.sh
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_PLATFORM" > /dev/null
          BT=$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS
          mkdir -p tools
          ln -s "$BT/aapt2" tools/aapt2
          ln -s "$BT/lib/dx.jar" tools/dx.jar
          ln -s "$BT/lib/apksigner.jar" tools/apksigner.jar
          echo "TOOLS=$PWD/tools" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-$ANDROID_PLATFORM/android.jar" >> "$GITHUB_ENV"
      - name: Cores
        run: |
          scripts/fetch-cores.sh android
          echo "CORES_DIR=$PWD/out" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          DASH_KS_PASS: ${{ secrets.DASH_KS_PASS }}
        run: |
          set -euo pipefail
          [ -n "$DASH_KS_PASS" ] || { echo "::error::secret DASH_KS_PASS is not set"; exit 1; }
          export DASH_KS=$PWD/keystore/dash-release.p12 DASH_KS_ALIAS=dash
          ./build.sh
          mkdir -p dist
          mv build/Dash.apk "dist/Dash-$VER.apk"
      - name: Publish release and update version.json on main
        env:
          DASH_KS_PASS: ${{ secrets.DASH_KS_PASS }}
        run: |
          set -euo pipefail
          f=dist/Dash-$VER.apk
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          gh release create "android-v$VER" "$f" --target main --title "Dash Android $VER" \
            --notes "SHA-256 \`Dash-$VER.apk\`: \`$sha\`"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/android-v$VER/Dash-$VER.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          jq --arg v "$VER" --argjson c "$CODE" --arg u "$url" --arg s "$sha" \
            '.android = (.android + {version: $v, code: $c, url: $u, sha256: $s})' version.json > /tmp/version.json
          mv /tmp/version.json version.json
          DASH_KS_PASS="$DASH_KS_PASS" scripts/sign-version.sh .
          [ -f version.json.sig ] && git add version.json.sig
          git commit -qam "Release: Android $VER"
          git push origin HEAD:main
